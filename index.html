<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมตารางธาตุและอะตอม Challenge</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 550px;
      text-align: center;
    }
    h1 { color: #38bdf8; margin-top: 0; font-size: 26px; }
    p { color: #cbd5e1; }
    
    .btn {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 14px 20px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }
    .btn:hover { background-color: #2563eb; transform: translateY(-2px); }
    .btn:active { transform: scale(0.98); }
    
    .btn-easy { background-color: #22c55e; }
    .btn-easy:hover { background-color: #16a34a; }
    .btn-medium { background-color: #eab308; color: #000; }
    .btn-medium:hover { background-color: #ca8a04; }
    .btn-hard { background-color: #ef4444; }
    .btn-hard:hover { background-color: #dc2626; }
    
    .timer-container {
      width: 100%;
      background-color: #334155;
      height: 12px;
      border-radius: 6px;
      margin: 15px 0 8px 0;
      overflow: hidden;
    }
    .timer-bar {
      height: 100%;
      width: 100%;
      background-color: #38bdf8;
      transition: width 0.1s linear;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <!-- หน้าเลือกระดับความยาก -->
    <div id="start-screen">
      <h1>⚛️ ตารางธาตุ & อะตอม Challenge</h1>
      <p>เลือกระดับความยากเพื่อเริ่มเกม:</p>
      <button class="btn btn-easy" onclick="startGame('easy')">🟢 ง่าย (15 วินาที/ข้อ)</button>
      <button class="btn btn-medium" onclick="startGame('medium')">🟡 ปานกลาง (10 วินาที/ข้อ)</button>
      <button class="btn btn-hard" onclick="startGame('hard')">🔴 ยาก (5 วินาที/ข้อ)</button>
    </div>

    <!-- หน้าเล่นเกม -->
    <div id="game-screen" class="hidden">
      <div class="status-bar">
        <span id="score-text">คะแนน: 0</span>
        <span id="question-count">ข้อที่ 1</span>
      </div>
      
      <div class="timer-container">
        <div id="timer-bar" class="timer-bar"></div>
      </div>
      <div id="timer-text" style="font-weight: bold; color: #38bdf8; margin-bottom: 15px;">⏱️ เหลือเวลา: 0 วินาที</div>

      <h2 id="question-text" style="font-size: 20px; min-height: 50px;">คำถามจะขึ้นตรงนี้</h2>
      <div id="choices-container" class="choices-grid"></div>
    </div>

    <!-- หน้าจบเกม -->
    <div id="result-screen" class="hidden">
      <h1>🏆 จบการแข่งขัน!</h1>
      <p id="final-score" style="font-size: 26px; font-weight: bold; color: #4ade80;"></p>
      <button class="btn" onclick="resetGame()">🔄 เล่นอีกครั้ง</button>
    </div>
  </div>

  <script>
    // คลังคำถามวิชาวิทยาศาสตร์ (ตารางธาตุและโครงสร้างอะตอม)
    const questionBank = {
      easy: [
        { question: "สัญลักษณ์เคมีของ 'โซเดียม' คืออะไร?", choices: ["Na", "So", "N", "Sd"], answer: "Na" },
        { question: "สัญลักษณ์เคมีของ 'ทองคำ' คืออะไร?", choices: ["Au", "Ag", "Fe", "Go"], answer: "Au" },
        { question: "สัญลักษณ์เคมีของ 'ไฮโดรเจน' คืออะไร?", choices: ["H", "He", "Hy", "Ho"], answer: "H" },
        { question: "สัญลักษณ์เคมีของ 'เหล็ก' คืออะไร?", choices: ["Fe", "Ir", "F", "Fe2"], answer: "Fe" },
        { question: "สัญลักษณ์เคมีของ 'ออกซิเจน' คืออะไร?", choices: ["O", "Ox", "Og", "Om"], answer: "O" },
        { question: "สัญลักษณ์เคมีของ 'โพแทสเซียม' คืออะไร?", choices: ["K", "P", "Po", "Pt"], answer: "K" }
      ],
      medium: [
        { question: "ธาตุที่มีเลขอะตอมเท่ากับ 6 คือธาตุใด?", choices: ["Carbon", "Oxygen", "Nitrogen", "Helium"], answer: "Carbon" },
        { question: "จำนวนนิวตรอนของ Carbon-14 (เลขอะตอม Z = 6) มีกี่ตัว?", choices: ["8", "6", "14", "12"], answer: "8" },
        { question: "แก๊สเฉื่อย (Noble Gases) จัดอยู่ในหมู่ใดของตารางธาตุ?", choices: ["หมู่ 8A", "หมู่ 1A", "หมู่ 7A", "หมู่ 2A"], answer: "หมู่ 8A" },
        { question: "อนุภาคที่มีประจุไฟฟ้าเป็นลบในอะตอมคืออะไร?", choices: ["อิเล็กตรอน", "โปรตอน", "นิวตรอน", "นิวเคลียส"], answer: "อิเล็กตรอน" },
        { question: "ธาตุหมู่ 1A มีชื่อเรียกเฉพาะว่าอย่างไร?", choices: ["โลหะอัลคาไล", "แฮโลเจน", "แก๊สมีตระกูล", "ธาตุแทรนซิชัน"], answer: "โลหะอัลคาไล" }
      ],
      hard: [
        { question: "การจัดเรียงอิเล็กตรอนของ Chlorine (Z=17) คือข้อใด?", choices: ["2, 8, 7", "2, 8, 8", "2, 7", "2, 8, 6, 1"], answer: "2, 8, 7" },
        { question: "Potassium (Z=19) มีการจัดเรียงอิเล็กตรอนแบบใด?", choices: ["2, 8, 8, 1", "2, 8, 9", "2, 8, 7, 2", "2, 8, 8"], answer: "2, 8, 8, 1" },
        { question: "ธาตุในคาบที่ 3 หมู่ 2A มีเลขอะตอมเท่าใด?", choices: ["12", "20", "4", "10"], answer: "12" },
        { question: "จำนวน 'เวเลนซ์อิเล็กตรอน' บอกสิ่งใดในตารางธาตุ?", choices: ["เลขหมู่", "เลขคาบ", "เลขมวล", "จำนวนนิวตรอน"], answer: "เลขหมู่" },
        { question: "การจัดเรียงระดับพลังงานหลักใช้สูตรคำนวณจำนวนอิเล็กตรอนสูงสุดเท่าใด?", choices: ["2n²", "n²", "2n", "4n²"], answer: "2n²" }
      ]
    };

    const timeLimits = { easy: 15, medium: 10, hard: 5 };

    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let timer = null;
    let timeLeft = 0;
    let maxTime = 10;

    function startGame(difficulty) {
      currentQuestions = [...questionBank[difficulty]].sort(() => Math.random() - 0.5);
      maxTime = timeLimits[difficulty];
      score = 0;
      currentQuestionIndex = 0;

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      showNextQuestion();
    }

    function showNextQuestion() {
      if (currentQuestionIndex >= currentQuestions.length) {
        endGame();
        return;
      }

      const q = currentQuestions[currentQuestionIndex];
      document.getElementById('score-text').innerText = `คะแนน: ${score}`;
      document.getElementById('question-count').innerText = `ข้อที่ ${currentQuestionIndex + 1}/${currentQuestions.length}`;
      document.getElementById('question-text').innerText = q.question;

      const choicesContainer = document.getElementById('choices-container');
      choicesContainer.innerHTML = '';

      const shuffledChoices = [...q.choices].sort(() => Math.random() - 0.5);
      shuffledChoices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = choice;
        btn.onclick = () => selectAnswer(choice);
        choicesContainer.appendChild(btn);
      });

      startTimer();
    }

    function startTimer() {
      clearInterval(timer);
      timeLeft = maxTime;
      updateTimerUI();

      timer = setInterval(() => {
        timeLeft -= 0.1;
        updateTimerUI();

        if (timeLeft <= 0) {
          clearInterval(timer);
          nextQuestion();
        }
      }, 100);
    }

    function updateTimerUI() {
      const percentage = (timeLeft / maxTime) * 100;
      document.getElementById('timer-bar').style.width = `${Math.max(0, percentage)}%`;
      document.getElementById('timer-text').innerText = `⏱️ เหลือเวลา: ${Math.max(0, Math.ceil(timeLeft))} วินาที`;
    }

    function selectAnswer(selectedChoice) {
      clearInterval(timer);
      const correctAnswer = currentQuestions[currentQuestionIndex].answer;
      if (selectedChoice === correctAnswer) {
        score += 10;
      }
      nextQuestion();
    }

    function nextQuestion() {
      currentQuestionIndex++;
      showNextQuestion();
    }

    function endGame() {
      clearInterval(timer);
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');
      document.getElementById('final-score').innerText = `คุณทำได้ ${score} คะแนน!`;
    }

    function resetGame() {
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }
  </script>
</body>
</html>
