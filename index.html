<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมตารางธาตุ อะตอม และพันธะเคมี Challenge</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 550px;
      text-align: center;
    }
    h1 { color: #38bdf8; margin-top: 0; font-size: 24px; }
    p { color: #cbd5e1; }
    
    .btn {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 14px 20px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }
    .btn:hover { background-color: #2563eb; transform: translateY(-2px); }
    .btn:active { transform: scale(0.98); }
    
    .btn-easy { background-color: #22c55e; }
    .btn-easy:hover { background-color: #16a34a; }
    .btn-medium { background-color: #eab308; color: #000; }
    .btn-medium:hover { background-color: #ca8a04; }
    .btn-hard { background-color: #ef4444; }
    .btn-hard:hover { background-color: #dc2626; }
    
    .timer-container {
      width: 100%;
      background-color: #334155;
      height: 12px;
      border-radius: 6px;
      margin: 15px 0 8px 0;
      overflow: hidden;
    }
    .timer-bar {
      height: 100%;
      width: 100%;
      background-color: #38bdf8;
      transition: width 0.1s linear;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <!-- หน้าเลือกระดับความยาก -->
    <div id="start-screen">
      <h1>⚛️ เคมี Challenge: อะตอม & พันธะเคมี</h1>
      <p>เลือกระดับความยากเพื่อเริ่มเกม:</p>
      <button class="btn btn-easy" onclick="startGame('easy')">🟢 ง่าย (15 วินาที/ข้อ)</button>
      <button class="btn btn-medium" onclick="startGame('medium')">🟡 ปานกลาง (10 วินาที/ข้อ)</button>
      <button class="btn btn-hard" onclick="startGame('hard')">🔴 ยาก (5 วินาที/ข้อ)</button>
    </div>

    <!-- หน้าเล่นเกม -->
    <div id="game-screen" class="hidden">
      <div class="status-bar">
        <span id="score-text">คะแนน: 0</span>
        <span id="question-count">ข้อที่ 1</span>
      </div>
      
      <div class="timer-container">
        <div id="timer-bar" class="timer-bar"></div>
      </div>
      <div id="timer-text" style="font-weight: bold; color: #38bdf8; margin-bottom: 15px;">⏱️ เหลือเวลา: 0 วินาที</div>

      <h2 id="question-text" style="font-size: 20px; min-height: 50px;">คำถามจะขึ้นตรงนี้</h2>
      <div id="choices-container" class="choices-grid"></div>
    </div>

    <!-- หน้าจบเกม -->
    <div id="result-screen" class="hidden">
      <h1>🏆 จบการแข่งขัน!</h1>
      <p id="final-score" style="font-size: 26px; font-weight: bold; color: #4ade80;"></p>
      <button class="btn" onclick="resetGame()">🔄 เล่นอีกครั้ง</button>
    </div>
  </div>

  <script>
    // รวมคลังคำถามเดิม + เรื่อง โปรตอน/อิเล็กตรอน (p/e) + พันธะเคมี
    const questionBank = {
      easy: [
        // เรื่อง โปรตอน/อิเล็กตรอน & อะตอมพื้นฐาน
        { question: "อะตอมที่เป็นกลางทางไฟฟ้า มีจำนวนโปรตอน (p) เท่ากับสิ่งใด?", choices: ["อิเล็กตรอน (e)", "นิวตรอน (n)", "เลขมวล (A)", "นิวเคลียส"], answer: "อิเล็กตรอน (e)" },
        { question: "อนุภาคในอะตอมที่มีประจุไฟฟ้าเป็นบวกคืออะไร?", choices: ["โปรตอน (p)", "อิเล็กตรอน (e)", "นิวตรอน (n)", "โพสิตรอน"], answer: "โปรตอน (p)" },
        { question: "ธาตุที่มีโปรตอน 1 ตัว และอิเล็กตรอน 1 ตัว คือธาตุใด?", choices: ["H (ไฮโดรเจน)", "He (ฮีเลียม)", "Li (ลิเทียม)", "C (คาร์บอน)"], answer: "H (ไฮโดรเจน)" },
        // เรื่อง พันธะเคมีพื้นฐาน
        { question: "พันธะเคมีที่เกิดจากการใช้อิเล็กตรอนร่วมกันเรียกว่าพันธะอะไร?", choices: ["พันธะโคเวเลนต์", "พันธะไอออนิก", "พันธะโลหะ", "พันธะไฮโดรเจน"], answer: "พันธะโคเวเลนต์" },
        { question: "พันธะที่เกิดจากการส่งผ่านอิเล็กตรอนระหว่าง 'โลหะ + อโลหะ' คือพันธะอะไร?", choices: ["พันธะไอออนิก", "พันธะโคเวเลนต์", "พันธะโลหะ", "พันธะเดี่ยว"], answer: "พันธะไอออนิก" },
        { question: "สัญลักษณ์เคมีของ 'โซเดียม' คืออะไร?", choices: ["Na", "So", "N", "Sd"], answer: "Na" }
      ],
      medium: [
        // คำนวณ โปรตอน/อิเล็กตรอน และ ไอออน
        { question: "ไอออน Na⁺ (เลขอะตอม Z = 11) มีจำนวนอิเล็กตรอนกี่ตัว?", choices: ["10 ตัว", "11 ตัว", "12 ตัว", "9 ตัว"], answer: "10 ตัว" },
        { question: "ไอออน Cl⁻ (เลขอะตอม Z = 17) มีจำนวนอิเล็กตรอนกี่ตัว?", choices: ["18 ตัว", "17 ตัว", "16 ตัว", "19 ตัว"], answer: "18 ตัว" },
        { question: "ธาตุที่มีเลขอะตอม Z = 6 และเลขมวล A = 14 มีนิวตรอนกี่ตัว?", choices: ["8 ตัว", "6 ตัว", "14 ตัว", "20 ตัว"], answer: "8 ตัว" },
        // พันธะเคมีระดับปานกลาง
        { question: "แรงยึดเหนี่ยวระหว่างอะตอมของโลหะด้วยกันเองเรียกว่าอะไร?", choices: ["พันธะโลหะ", "พันธะไอออนิก", "พันธะโคเวเลนต์", "แรงวันเดอร์วาลส์"], answer: "พันธะโลหะ" },
        { question: "สารประกอบเกลือแกง (NaCl) จัดเป็นพันธะเคมีประเภทใด?", choices: ["พันธะไอออนิก", "พันธะโคเวเลนต์", "พันธะโลหะ", "พันธะไฮโดรเจน"], answer: "พันธะไอออนิก" },
        { question: "โมเลกุลน้ำ (H₂O) จัดเป็นการรวมกันด้วยพันธะประเภทใด?", choices: ["พันธะโคเวเลนต์", "พันธะไอออนิก", "พันธะโลหะ", "พันธะแก๊ส"], answer: "พันธะโคเวเลนต์" }
      ],
      hard: [
        // คำนวณ p, e, n ซับซ้อน & การจัดเรียง
        { question: "ไอออน O²⁻ (Z = 8, A = 16) มีจำนวน p, e, n เท่ากับเท่าใด?", choices: ["p=8, e=10, n=8", "p=8, e=8, n=8", "p=8, e=6, n=10", "p=10, e=8, n=8"], answer: "p=8, e=10, n=8" },
        { question: "การจัดเรียงอิเล็กตรอนของ Ca (Z = 20) คือข้อใด?", choices: ["2, 8, 8, 2", "2, 8, 10", "2, 8, 9, 1", "2, 18, 2"], answer: "2, 8, 8, 2" },
        { question: "ไอออน Ca²⁺ (Z = 20) มีการจัดเรียงอิเล็กตรอนเหมือนแก๊สเฉื่อยใด?", choices: ["Ar (อาร์กอน)", "Ne (นีออน)", "Kr (คริปทอน)", "He (ฮีเลียม)"], answer: "Ar (อาร์กอน)" },
        // เจาะลึกพันธะเคมี
        { question: "ข้อใดคือโมเลกุลที่มี 'พันธะคู่' (Double Bond)?", choices: ["O₂ (ออกซิเจน)", "H₂ (ไฮโดรเจน)", "N₂ (ไนโตรเจน)", "HCl (กรดเกลือ)"], answer: "O₂ (ออกซิเจน)" },
        { question: "พันธะในโมเลกุลแก๊สไนโตรเจน (N₂) เป็นพันธะชนิดใด?", choices: ["พันธะสาม", "พันธะคู่", "พันธะเดี่ยว", "พันธะไอออนิก"], answer: "พันธะสาม" }
      ]
    };

    const timeLimits = { easy: 15, medium: 10, hard: 5 };

    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let timer = null;
    let timeLeft = 0;
    let maxTime = 10;

    function startGame(difficulty) {
      currentQuestions = [...questionBank[difficulty]].sort(() => Math.random() - 0.5);
      maxTime = timeLimits[difficulty];
      score = 0;
      currentQuestionIndex = 0;

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      showNextQuestion();
    }

    function showNextQuestion() {
      if (currentQuestionIndex >= currentQuestions.length) {
        endGame();
        return;
      }

      const q = currentQuestions[currentQuestionIndex];
      document.getElementById('score-text').innerText = `คะแนน: ${score}`;
      document.getElementById('question-count').innerText = `ข้อที่ ${currentQuestionIndex + 1}/${currentQuestions.length}`;
      document.getElementById('question-text').innerText = q.question;

      const choicesContainer = document.getElementById('choices-container');
      choicesContainer.innerHTML = '';

      const shuffledChoices = [...q.choices].sort(() => Math.random() - 0.5);
      shuffledChoices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = choice;
        btn.onclick = () => selectAnswer(choice);
        choicesContainer.appendChild(btn);
      });

      startTimer();
    }

    function startTimer() {
      clearInterval(timer);
      timeLeft = maxTime;
      updateTimerUI();

      timer = setInterval(() => {
        timeLeft -= 0.1;
        updateTimerUI();

        if (timeLeft <= 0) {
          clearInterval(timer);
          nextQuestion();
        }
      }, 100);
    }

    function updateTimerUI() {
      const percentage = (timeLeft / maxTime) * 100;
      document.getElementById('timer-bar').style.width = `${Math.max(0, percentage)}%`;
      document.getElementById('timer-text').innerText = `⏱️ เหลือเวลา: ${Math.max(0, Math.ceil(timeLeft))} วินาที`;
    }

    function selectAnswer(selectedChoice) {
      clearInterval(timer);
      const correctAnswer = currentQuestions[currentQuestionIndex].answer;
      if (selectedChoice === correctAnswer) {
        score += 10;
      }
      nextQuestion();
    }

    function nextQuestion() {
      currentQuestionIndex++;
      showNextQuestion();
    }

    function endGame() {
      clearInterval(timer);
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');
      document.getElementById('final-score').innerText = `คุณทำได้ ${score} คะแนน!`;
    }

    function resetGame() {
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }
  </script>
</body>
</html>
